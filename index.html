<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Capture Profile Photo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3ff;
      color: #222;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .camera-card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    .title {
      text-align: center;
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #3f2a8f;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 18px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transform: scaleX(-1);
      background: #111;
    }

    #photoPreview {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      min-height: 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .status.ready {
      color: #388e3c;
    }

    .status.error {
      color: #d32f2f;
    }

    .status.success {
      color: #2e7d32;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #captureBtn {
      background: #5b3cc4;
      color: #fff;
    }

    #retakeBtn {
      background: #eeeeee;
      color: #333;
      display: none;
    }

    #usePhotoBtn {
      background: #2e7d32;
      color: #fff;
      display: none;
    }

    #cancelBtn {
      background: #eeeeee;
      color: #333;
    }

    .permission-message {
      display: none;
      text-align: center;
      padding: 30px 15px;
      color: #555;
      line-height: 1.5;
    }

    .permission-message strong {
      display: block;
      color: #d32f2f;
      margin-bottom: 8px;
      font-size: 17px;
    }

    canvas {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .camera-card {
        padding: 16px;
        border-radius: 18px;
      }

      .title {
        font-size: 20px;
      }

      .subtitle {
        font-size: 13px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="camera-card">

    <div class="title">
      Capture Profile Photo
    </div>

    <div class="subtitle">
      Position yourself in the camera and tap Capture Photo.
    </div>

    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <img
        id="photoPreview"
        alt="Captured profile photo">

    </div>

    <div
      id="status"
      class="status">
      Starting camera...
    </div>

    <div
      id="permissionMessage"
      class="permission-message">

      <strong>Camera Access Required</strong>

      Please allow camera access in your browser/device settings,
      then reload this page.

    </div>

    <canvas id="canvas"></canvas>

    <div class="buttons">

      <button
        id="captureBtn"
        type="button"
        disabled>
        📷 Capture Photo
      </button>

      <button
        id="retakeBtn"
        type="button">
        ↻ Retake
      </button>

      <button
        id="usePhotoBtn"
        type="button">
        ✓ Use This Photo
      </button>

      <button
        id="cancelBtn"
        type="button">
        Cancel
      </button>

    </div>

  </div>

<script>

  let stream = null;
  let capturedPhotoDataUrl = '';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const photoPreview = document.getElementById('photoPreview');

  const status = document.getElementById('status');
  const permissionMessage =
    document.getElementById('permissionMessage');

  const captureBtn =
    document.getElementById('captureBtn');

  const retakeBtn =
    document.getElementById('retakeBtn');

  const usePhotoBtn =
    document.getElementById('usePhotoBtn');

  const cancelBtn =
    document.getElementById('cancelBtn');


  /*
   * Send messages back to the Journal Proposal
   * registration page.
   */
  function sendMessage(payload) {

    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          payload,
          '*'
        );

      }

    } catch (error) {
      console.log(
        'opener message error:',
        error
      );
    }


    try {

      if (
        window.parent &&
        window.parent !== window
      ) {

        window.parent.postMessage(
          payload,
          '*'
        );

      }

    } catch (error) {
      console.log(
        'parent message error:',
        error
      );
    }

  }


  /*
   * Update status text.
   */
  function setStatus(
    message,
    type = ''
  ) {

    status.textContent = message;

    status.className =
      'status ' + type;

  }


  /*
   * Start camera.
   */
  async function startCamera() {

    try {

      setStatus(
        'Starting camera...',
        ''
      );

      permissionMessage.style.display =
        'none';

      captureBtn.disabled = true;


      /*
       * Front-facing camera.
       */
      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: 'user',

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            }
          },

          audio: false

        });


      video.srcObject = stream;

      await video.play();


      captureBtn.disabled = false;

      setStatus(
        'Camera ready. Tap Capture Photo.',
        'ready'
      );


      /*
       * Tell Index.html that the camera
       * page is ready.
       */
      sendMessage({
        type: 'JPS_CAMERA_READY'
      });


    } catch (error) {

      console.error(
        'Camera error:',
        error
      );

      captureBtn.disabled = true;

      permissionMessage.style.display =
        'block';

      setStatus(
        'Camera could not be opened.',
        'error'
      );

    }

  }


  /*
   * Capture photo directly.
   *
   * IMPORTANT:
   * There is NO face detection here.
   * There is NO validation.
   * Any camera frame can be captured.
   */
  function capturePhoto() {

    if (!video.videoWidth || !video.videoHeight) {

      setStatus(
        'Camera is not ready yet.',
        'error'
      );

      return;

    }


    const width =
      video.videoWidth || 640;

    const height =
      video.videoHeight || 480;


    canvas.width = width;
    canvas.height = height;


    const context =
      canvas.getContext('2d');


    /*
     * Because the preview is mirrored,
     * capture it mirrored as well so the
     * saved image looks natural to the user.
     */
    context.save();

    context.translate(
      width,
      0
    );

    context.scale(
      -1,
      1
    );

    context.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    context.restore();


    capturedPhotoDataUrl =
      canvas.toDataURL(
        'image/jpeg',
        0.88
      );


    /*
     * Show captured image.
     */
    photoPreview.src =
      capturedPhotoDataUrl;

    photoPreview.style.display =
      'block';

    video.style.display =
      'none';


    /*
     * Stop camera.
     */
    stopCamera();


    captureBtn.style.display =
      'none';

    retakeBtn.style.display =
      'block';

    usePhotoBtn.style.display =
      'block';


    setStatus(
      'Profile photo captured ✓',
      'success'
    );


    /*
     * Send captured photo immediately.
     * This keeps compatibility with the
     * existing Index.html message system.
     */
    sendMessage({

      type: 'JPS_PROFILE_CAPTURED',

      photoDataUrl:
        capturedPhotoDataUrl,

      source:
        'camera_capture'

    });

  }


  /*
   * Use captured photo.
   */
  function usePhoto() {

    if (!capturedPhotoDataUrl) {

      setStatus(
        'Please capture a photo first.',
        'error'
      );

      return;

    }


    /*
     * Main message expected by the
     * Journal Proposal registration page.
     */
    sendMessage({

      type: 'JPS_PROFILE_RECEIVED',

      photoDataUrl:
        capturedPhotoDataUrl,

      source:
        'camera'

    });


    /*
     * Also send the confirmation message
     * for compatibility with the existing
     * camera integration.
     */
    sendMessage({

      type: 'JPS_CAMERA_CONFIRMED',

      match: true,

      source:
        'camera_capture',

      photoDataUrl:
        capturedPhotoDataUrl

    });


    setStatus(
      'Photo accepted ✓ Returning...',
      'success'
    );


    /*
     * Give the parent page a moment to
     * receive the message before closing.
     */
    setTimeout(
      function() {

        try {

          if (
            window.opener &&
            !window.opener.closed
          ) {

            window.close();

            return;

          }

        } catch (error) {}


        /*
         * If this page is inside an iframe,
         * the parent will handle the message.
         */
      },
      250
    );

  }


  /*
   * Retake photo.
   */
  async function retakePhoto() {

    capturedPhotoDataUrl = '';

    photoPreview.src = '';

    photoPreview.style.display =
      'none';

    video.style.display =
      'block';


    captureBtn.style.display =
      'block';

    captureBtn.disabled =
      true;

    retakeBtn.style.display =
      'none';

    usePhotoBtn.style.display =
      'none';


    await startCamera();

  }


  /*
   * Stop camera tracks.
   */
  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {
            track.stop();
          }
        );

      stream = null;

    }

  }


  /*
   * Cancel camera.
   */
  function cancelCamera() {

    stopCamera();


    sendMessage({
      type: 'JPS_CAMERA_CANCELLED'
    });


    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.close();

      }

    } catch (error) {}

  }


  /*
   * Button events.
   */
  captureBtn.addEventListener(
    'click',
    capturePhoto
  );

  retakeBtn.addEventListener(
    'click',
    retakePhoto
  );

  usePhotoBtn.addEventListener(
    'click',
    usePhoto
  );

  cancelBtn.addEventListener(
    'click',
    cancelCamera
  );


  /*
   * Cleanup when page closes.
   */
  window.addEventListener(
    'beforeunload',
    function() {
      stopCamera();
    }
  );


  /*
   * Start automatically.
   */
  if (
    navigator.mediaDevices &&
    navigator.mediaDevices.getUserMedia
  ) {

    startCamera();

  } else {

    permissionMessage.style.display =
      'block';

    setStatus(
      'This browser does not support camera access.',
      'error'
    );

  }

</script>

</body>
</html>
