<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Face Verification</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f3efff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #5b3cc4;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .camera-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
      aspect-ratio: 4 / 3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f5f5f5;
      color: #444;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .requirements {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #faf9ff;
      border: 1px solid #e7e0ff;
    }

    .requirements-title {
      font-weight: bold;
      color: #5b3cc4;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .requirements ul {
      margin: 0;
      padding-left: 20px;
      color: #555;
      font-size: 13px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      min-height: 46px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .cancel {
      background: #eeeeee;
      color: #444;
    }

    .start {
      background: #5b3cc4;
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button:not(:disabled):active {
      transform: scale(0.98);
    }

    .success {
      background: #e9f9ef;
      color: #19733c;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    .loading {
      background: #f0edff;
      color: #5b3cc4;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
        align-items: flex-start;
      }

      .card {
        margin-top: 10px;
        padding: 18px;
        border-radius: 16px;
      }

      h1 {
        font-size: 23px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      body {
        align-items: flex-start;
      }

      .card {
        max-width: 700px;
        margin: 10px auto;
      }

      .camera-box {
        max-height: 65vh;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Live Face Verification</h1>

    <p class="subtitle">
      Please position your face clearly in front of the camera.
    </p>

    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="status" class="status loading">
      Preparing camera and face recognition...
    </div>

    <div class="requirements">
      <div class="requirements-title">
        Verification Requirements
      </div>

      <ul>
        <li>Make sure your face is clearly visible.</li>
        <li>Use good lighting.</li>
        <li>Keep only one face in the camera.</li>
        <li>Look naturally toward the camera.</li>
      </ul>
    </div>

    <div class="buttons">
      <button
        id="cancelBtn"
        class="cancel"
        type="button">
        Cancel
      </button>

      <button
        id="startBtn"
        class="start"
        type="button"
        disabled>
        Start Live Verification
      </button>
    </div>

  </div>

<script>
'use strict';

/* =========================================================
   CONFIGURATION
   ========================================================= */

const MODEL_URL =
  'https://raw.githubusercontent.com/justadudewhohacks/face-api.js-models/master/';

const MATCH_THRESHOLD = 0.72;

const LIVE_SAMPLE_COUNT = 4;
const LIVE_SAMPLE_DELAY = 180;


/*
 * Higher-approval recognition:
 *
 * We no longer calculate an average distance and reject
 * because of one bad camera frame.
 *
 * A person passes when at least 2 of 4 live samples are
 * within MATCH_THRESHOLD.
 */
const REQUIRED_MATCHES = 2;


/* =========================================================
   ELEMENTS
   ========================================================= */

const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const cancelBtn = document.getElementById('cancelBtn');


/* =========================================================
   STATE
   ========================================================= */

let stream = null;
let profileDescriptor = null;
let nonce = null;
let modelsLoaded = false;
let verificationRunning = false;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type) {
  statusEl.textContent = message;

  statusEl.className = 'status';

  if (type) {
    statusEl.classList.add(type);
  }
}


/* =========================================================
   URL / NONCE
   ========================================================= */

function getNonce() {
  const params = new URLSearchParams(window.location.search);
  return params.get('nonce') || '';
}

nonce = getNonce();


/* =========================================================
   PARENT WINDOW MESSAGING
   ========================================================= */

function sendToParent(message) {
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(
        message,
        '*'
      );
    }
  } catch (err) {
    console.error('postMessage error:', err);
  }
}


/* =========================================================
   CANCEL
   ========================================================= */

function cancelVerification() {

  stopCamera();

  sendToParent({
    type: 'JPS_CAMERA_CANCELLED',
    nonce: nonce
  });

  try {
    window.close();
  } catch (err) {
    console.log(err);
  }
}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(function(track) {
      try {
        track.stop();
      } catch (err) {
        console.log(err);
      }
    });

    stream = null;
  }

  try {
    video.pause();
  } catch (err) {
    console.log(err);
  }

  video.srcObject = null;
}


/* =========================================================
   LOAD FACE API MODELS
   ========================================================= */

async function loadModels() {

  setStatus(
    'Loading face recognition models...',
    'loading'
  );

  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL + 'tiny_face_detector'
  );

  await faceapi.nets.faceLandmark68Net.loadFromUri(
    MODEL_URL + 'face_landmark_68'
  );

  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL + 'face_recognition'
  );

  modelsLoaded = true;

  setStatus(
    'Face recognition is ready.',
    'success'
  );
}


/* =========================================================
   READ PROFILE PHOTO
   ========================================================= */

function receiveProfilePhoto(event) {

  const data = event.data;

  if (!data) {
    return;
  }

  if (data.type !== 'JPS_PROFILE_PHOTO') {
    return;
  }

  if (data.nonce !== nonce) {
    return;
  }

  if (!data.photoDataUrl) {
    setStatus(
      'No profile photo was received.',
      'error'
    );

    return;
  }

  processProfilePhoto(
    data.photoDataUrl
  );
}


/* =========================================================
   LOAD IMAGE
   ========================================================= */

function loadImage(src) {

  return new Promise(function(resolve, reject) {

    const img = new Image();

    img.onload = function() {
      resolve(img);
    };

    img.onerror = function() {
      reject(
        new Error('Unable to load the profile photo.')
      );
    };

    img.src = src;
  });
}


/* =========================================================
   DETECT PROFILE FACE
   ========================================================= */

async function detectLiveFace(img) {

  const options =
    new faceapi.TinyFaceDetectorOptions({
      inputSize: 224,
      scoreThreshold: 0.45
    });

  const detections =
    await faceapi
      .detectAllFaces(img, options)
      .withFaceLandmarks()
      .withFaceDescriptors();

  if (!detections || detections.length === 0) {

    throw new Error(
      'No face was detected in the uploaded profile photo.'
    );
  }

  if (detections.length > 1) {

    throw new Error(
      'Please upload a profile photo containing only one face.'
    );
  }

  const detection = detections[0];

  if (detection.detection.score < 0.45) {

    throw new Error(
      'The face in the profile photo is not clear enough.'
    );
  }

  const box = detection.detection.box;

  const imageArea =
    img.width * img.height;

  const faceArea =
    box.width * box.height;

  const faceRatio =
    faceArea / imageArea;

  if (faceRatio < 0.025) {

    throw new Error(
      'The face in the profile photo is too small.'
    );
  }

  return detection;
}


/* =========================================================
   PROCESS PROFILE PHOTO
   ========================================================= */

async function processProfilePhoto(photoDataUrl) {

  try {

    if (!modelsLoaded) {
      await loadModels();
    }

    setStatus(
      'Checking the uploaded profile photo...',
      'loading'
    );

    const img =
      await loadImage(photoDataUrl);

    const detection =
      await detectLiveFace(img);

    profileDescriptor =
      detection.descriptor;

    sendToParent({
      type: 'JPS_PROFILE_RECEIVED',
      nonce: nonce
    });

    setStatus(
      'Profile face loaded. You can start live verification.',
      'success'
    );

    startBtn.disabled = false;

  } catch (error) {

    console.error(error);

    profileDescriptor = null;

    startBtn.disabled = true;

    setStatus(
      error.message ||
      'Unable to process the profile photo.',
      'error'
    );
  }
}


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera() {

  stopCamera();

  setStatus(
    'Requesting camera access...',
    'loading'
  );

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: {
            ideal: 640
          },
          height: {
            ideal: 480
          }
        },
        audio: false
      });

    video.srcObject = stream;

    await video.play();

    setStatus(
      'Camera ready. Position your face clearly.',
      'success'
    );

  } catch (error) {

    console.error(error);

    if (
      error.name === 'NotAllowedError' ||
      error.name === 'PermissionDeniedError'
    ) {

      setStatus(
        'Camera access was denied. Please allow camera permission and try again.',
        'error'
      );

    } else if (
      error.name === 'NotFoundError'
    ) {

      setStatus(
        'No camera was found on this device.',
        'error'
      );

    } else {

      setStatus(
        'Unable to access the camera. Please check your camera permission.',
        'error'
      );
    }

    throw error;
  }
}


/* =========================================================
   WAIT
   ========================================================= */

function wait(ms) {

  return new Promise(function(resolve) {
    setTimeout(resolve, ms);
  });
}


/* =========================================================
   CAPTURE LIVE FACE
   ========================================================= */

async function getLiveFace() {

  const options =
    new faceapi.TinyFaceDetectorOptions({
      inputSize: 224,
      scoreThreshold: 0.45
    });

  const detections =
    await faceapi
      .detectAllFaces(video, options)
      .withFaceLandmarks()
      .withFaceDescriptors();

  if (!detections || detections.length === 0) {

    throw new Error(
      'No face detected. Please position your face inside the camera.'
    );
  }

  if (detections.length > 1) {

    throw new Error(
      'More than one face was detected. Only one person should be visible.'
    );
  }

  const detection = detections[0];

  if (detection.detection.score < 0.45) {

    throw new Error(
      'Your face is not clear enough. Please move closer to the camera.'
    );
  }

  const box = detection.detection.box;

  const frameArea =
    video.videoWidth * video.videoHeight;

  const faceArea =
    box.width * box.height;

  const faceRatio =
    faceArea / frameArea;

  if (faceRatio < 0.025) {

    throw new Error(
      'Your face is too small. Please move closer to the camera.'
    );
  }

  return detection;
}


/* =========================================================
   VERIFY IDENTITY
   ========================================================= */

async function verifyIdentity() {

  if (!profileDescriptor) {

    throw new Error(
      'The uploaded profile face is not ready.'
    );
  }

  if (!stream) {

    await startCamera();
  }

  verificationRunning = true;

  startBtn.disabled = true;
  cancelBtn.disabled = true;

  setStatus(
    'Recognizing your face...',
    'loading'
  );

  const distances = [];

  let goodSamples = 0;

  /*
   * Take 4 live samples.
   *
   * A single blurry/bad frame will not automatically
   * cause rejection.
   */

  for (
    let i = 0;
    i < LIVE_SAMPLE_COUNT;
    i++
  ) {

    try {

      const liveFace =
        await getLiveFace();

      const distance =
        faceapi.euclideanDistance(
          profileDescriptor,
          liveFace.descriptor
        );

      distances.push(distance);

      if (distance <= MATCH_THRESHOLD) {
        goodSamples++;
      }

    } catch (sampleError) {

      console.log(
        'Live sample skipped:',
        sampleError.message
      );

    }

    await wait(LIVE_SAMPLE_DELAY);
  }


  /*
   * HIGHER-APPROVAL RULE
   *
   * Only 2 of the 4 samples need to match.
   *
   * We intentionally do NOT use:
   *
   *   average distance
   *   minimum distance requirement
   *
   * because poor lighting / camera frames can make
   * one or two samples much worse even when the person
   * is actually the correct person.
   */

  if (goodSamples < REQUIRED_MATCHES) {

    throw new Error(
      'Face recognition failed. Please face the camera clearly and try again.'
    );
  }


  /* =======================================================
     SUCCESS
     ======================================================= */

  const sorted =
    distances.slice().sort(function(a, b) {
      return a - b;
    });

  const bestDistance =
    sorted.length
      ? sorted[0]
      : null;

  setStatus(
    'Face verification successful!',
    'success'
  );

  sendToParent({
    type: 'JPS_CAMERA_CONFIRMED',
    nonce: nonce,
    match: true,
    distance: bestDistance,
    matchedSamples: goodSamples,
    totalSamples: LIVE_SAMPLE_COUNT,
    timestamp: Date.now()
  });

  await wait(700);

  stopCamera();

  try {
    window.close();
  } catch (err) {
    console.log(err);
  }
}


/* =========================================================
   START VERIFICATION BUTTON
   ========================================================= */

startBtn.addEventListener(
  'click',
  async function() {

    if (verificationRunning) {
      return;
    }

    try {

      if (!profileDescriptor) {

        setStatus(
          'The profile photo has not finished loading yet.',
          'error'
        );

        return;
      }

      await startCamera();

      await wait(700);

      await verifyIdentity();

    } catch (error) {

      console.error(error);

      verificationRunning = false;

      startBtn.disabled = false;
      cancelBtn.disabled = false;

      setStatus(
        error.message ||
        'Face verification failed. Please try again.',
        'error'
      );
    }
  }
);


/* =========================================================
   CANCEL BUTTON
   ========================================================= */

cancelBtn.addEventListener(
  'click',
  cancelVerification
);


/* =========================================================
   RECEIVE PROFILE PHOTO
   ========================================================= */

window.addEventListener(
  'message',
  receiveProfilePhoto
);


/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize() {

  if (!nonce) {

    setStatus(
      'Invalid camera verification link. Missing verification token.',
      'error'
    );

    return;
  }

  try {

    if (
      !window.opener ||
      window.opener.closed
    ) {

      setStatus(
        'Please open this camera page from the Journal Proposal System.',
        'error'
      );

      return;
    }

    await loadModels();

    sendToParent({
      type: 'JPS_CAMERA_READY',
      nonce: nonce
    });

    setStatus(
      'Ready. Waiting for your profile photo...',
      'loading'
    );

  } catch (error) {

    console.error(error);

    setStatus(
      'Unable to load the face recognition system. Please refresh and try again.',
      'error'
    );
  }
}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  'load',
  initialize
);


/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  'beforeunload',
  function() {
    stopCamera();
  }
);

</script>

</body>
</html>
